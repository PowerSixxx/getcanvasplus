      chrome.runtime.sendMessage(EXT, { type: 'cp-ref', code: code }, function (res) {
        if (chrome.runtime.lastError || !res || !res.ok) return later();
        handed = true;
        var li = $('steps').children; li[0].className = 'done'; li[1].className = 'now';
        $('install').hidden = true; msg(T.got, 'ok');
      });
    } catch (e) { later(); }
  }
  var handed = false;
  function later() { if (!handed && ++tries < 450) setTimeout(hand, 2000); }
  // A page only gets its line to an extension installed after it opened by loading again: when they come back to
  // this tab (from the Chrome Web Store), reload once.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !handed && !(window.chrome && chrome.runtime && chrome.runtime.sendMessage)) location.reload();
  });
  hand();
})();
</script>
